<text x="500" y="598" font-size="28" font-weight="700" fill="#9a5200" text-anchor="middle">Positive ions move through the electrolyte  →</text>
<text x="500" y="636" font-size="22" font-weight="400" fill="#37474f" text-anchor="middle">Yellow: electrolyte.  Dashed line: separator (ions pass, electrons cannot).</text>
<text x="500" y="674" font-size="22" font-weight="400" fill="#37474f" text-anchor="middle">Lithium-ion battery in use. Charging pushes both flows backwards.</text>
