<text x="265" y="380" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">Anode</text>
<text x="265" y="448" font-size="64" font-weight="700" fill="#fff" text-anchor="middle">−</text>
<text x="265" y="498" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">gives up</text>
<text x="265" y="530" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">electrons</text>
