<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brain">
<meta name="theme-color" content="#07090d">
<title>Brain Graph</title>
<link rel="stylesheet" href="style.css?v=38">
</head>
<body>
<canvas id="c"></canvas>

<div id="bar">
  <button id="btnPanel" title="Panel" aria-label="Toggle panel">☰</button>
  <button id="btn3d" title="3D view on/off" aria-pressed="true">3D</button>
  <button id="btnFit" title="Fit all">Fit</button>
  <button id="btnPath" title="Path mode: tap two notes to trace the route" aria-pressed="false">Path</button>
</div>

<button id="orb" type="button" aria-label="J.A.R.V.I.S. voice: tap to talk" title="Tap to talk">
  <canvas id="orbc" width="220" height="220"></canvas>
  <span id="orbState">STANDBY</span>
</button>

<aside id="panel">
  <header>
    <h1>Brain Graph</h1>
    <div id="stats">loading…</div>
  </header>

  <input id="search" type="search" placeholder="Search the brain…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="results"></div>

  <section id="ask">
    <h2>Ask the brain</h2>
    <div id="answer"></div>
    <form id="askForm">
      <input id="askInput" type="text" placeholder="Ask about your projects…" enterkeyhint="send" autocomplete="off">
      <button type="submit" id="askGo">Ask</button>
      <button type="button" id="askMic" title="Speak">🎤</button>
    </form>
    <label class="inline"><input type="checkbox" id="speak"> Read answers aloud</label>
    <label class="voice">Voice <select id="voice" aria-label="Jarvis voice"></select></label>
    <div class="gkbox">
      <div class="clabel2">Free AI key (Groq or Gemini)</div>
      <input id="gkKey" type="password" placeholder="gsk_... or AIza..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="grow"><button type="button" id="gkSave" class="gbtn">Save key</button><button type="button" id="gkClear" class="gbtn" hidden>Remove</button></div>
      <p id="gkStatus" class="voice"></p>
    </div>
    <div class="gkbox vsbox">
      <div class="clabel2">VoiceStudio (your own PC, optional)</div>
      <input id="vsUrl" type="url" placeholder="http://localhost:3900" autocomplete="off" autocapitalize="off" spellcheck="false">
      <select id="vsPick" aria-label="VoiceStudio voice" hidden></select>
      <input id="vsVoice" type="text" placeholder="Voice ID (or pick one above)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <input id="vsKey" type="password" placeholder="API key (only if you set one)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label class="inline"><input type="checkbox" id="vsListen"> Also use VoiceStudio to hear me (speech to text)</label>
      <div class="grow"><button type="button" id="vsSave" class="gbtn">Save and test</button><button type="button" id="vsClear" class="gbtn" hidden>Remove</button></div>
      <p id="vsStatus" class="voice"></p>
    </div>
    <p id="voiceStatus" class="voice" style="color:#9fb3c8">Tap the orb to talk.</p>
    <label class="voice">Microphone <select id="mic" aria-label="Microphone"><option value="">Default (tap the orb to list)</option></select></label>
    <div id="evcard" hidden>
      <div class="clabel">Calendar event (nothing is added until you tap Add)</div>
      <input id="eTitle" type="text" placeholder="Title" autocomplete="off">
      <label class="elab">Starts <input id="eStart" type="datetime-local"></label>
      <label class="elab">Ends <input id="eEnd" type="datetime-local"></label>
      <input id="eLoc" type="text" placeholder="Location (optional)" autocomplete="off">
      <div class="grow">
        <button type="button" id="eAdd" class="gbtn">Add</button>
        <button type="button" id="eCancel" class="gbtn">Discard</button>
      </div>
    </div>
  </section>

  <section id="google">
    <h2>Calendar &amp; Gmail</h2>
    <div id="gStatus" class="hint">Not connected.</div>
    <div id="gAgenda"></div>
    <div class="grow">
      <button type="button" id="gConnect" class="gbtn">Connect Google</button>
      <button type="button" id="gRefresh" class="gbtn" hidden>Refresh</button>
      <button type="button" id="gOut" class="gbtn" hidden>Sign out</button>
    </div>
    <div id="compose" hidden>
      <div class="clabel">Draft email (nothing is sent until you tap Send)</div>
      <input id="cTo" type="email" placeholder="To (email address)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <input id="cSubj" type="text" placeholder="Subject" autocomplete="off">
      <textarea id="cBody" rows="8" placeholder="Message"></textarea>
      <div class="grow">
        <button type="button" id="cSend" class="gbtn">Send</button>
        <button type="button" id="cSave" class="gbtn">Save draft</button>
        <button type="button" id="cCancel" class="gbtn">Discard</button>
      </div>
    </div>
  </section>

  <section>
    <h2>Inspector</h2>
    <div id="inspector"></div>
  </section>

  <section>
    <h2>Top hubs</h2>
    <div id="hubs"></div>
  </section>

  <section>
    <h2>Filter</h2>
    <div id="filters"></div>
  </section>

  <section>
    <h2>Forces</h2>
    <label>Repel <input id="repel" type="range" min="60" max="1200" value="300"></label>
    <label>Link length <input id="linklen" type="range" min="15" max="150" value="45"></label>
  </section>
</aside>

<div id="toast"></div>
<script src="config.js?v=38"></script>
<script src="app.js?v=38"></script>
</body>
</html>
